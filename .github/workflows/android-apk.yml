name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nama versi APK (contoh: 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (sudah tersedia di runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Siapkan keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "store_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "Memakai keystore dari secrets."
          else
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" \
              -alias akuninstan -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass akuninstan -keypass akuninstan \
              -dname "CN=Akun Instan, OU=Mobile, O=Akun Instan, L=Jakarta, C=ID"
            echo "store_password=akuninstan" >> "$GITHUB_OUTPUT"
            echo "key_alias=akuninstan" >> "$GITHUB_OUTPUT"
            echo "key_password=akuninstan" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 belum diisi, memakai keystore sementara. Update APK berikutnya bisa gagal terpasang."
          fi
          echo "path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"

      - name: Tentukan versi
        id: version
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version_name }}"
          fi
          if [ -z "$VERSION" ]; then VERSION="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "name=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build APK release
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: gradle assembleRelease --no-daemon

      - name: Ganti nama APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/akun-instan-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk dist/akun-instan.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: akun-instan-apk
          path: dist/*.apk

      - name: Publish ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          make_latest: true
          files: dist/*.apk
          name: Akun Instan ${{ steps.version.outputs.name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
