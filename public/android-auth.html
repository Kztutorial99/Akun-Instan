<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Masuk dengan Google · Akun Instan</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f8fb; color: #0f172a;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #fff; border: 1px solid #eceef3; border-radius: 24px;
    padding: 32px 24px; max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 12px 32px -16px rgba(15, 23, 42, .15);
  }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px;
    background: linear-gradient(135deg, #5b8cff, #2f5be0);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 24px;
  }
  h1 { font-size: 19px; margin-bottom: 6px; }
  p { color: #64748b; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
  button {
    width: 100%; border: 1px solid #eceef3; background: #fff; border-radius: 14px;
    padding: 13px 16px; font-size: 15px; font-weight: 600; color: #0f172a;
    display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  }
  button:active { background: #f4f6fa; }
  button:disabled { opacity: .6; cursor: default; }
  .g { width: 20px; height: 20px; }
  .err { color: #dc2626; font-size: 13px; margin-top: 14px; display: none; }
  .ok { color: #16a34a; font-size: 13px; margin-top: 14px; display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">AI</div>
    <h1>Masuk ke Akun Instan</h1>
    <p>Pilih akun Google kamu. Setelah berhasil, kamu akan otomatis kembali ke aplikasi.</p>
    <button id="btn" type="button">
      <svg class="g" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41 35.4 44 30.2 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      <span id="btnLabel">Pilih akun Google</span>
    </button>
    <div class="err" id="err"></div>
    <div class="ok" id="ok">Berhasil! Membuka aplikasi...</div>
  </div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  var CLIENT_ID = "838919285407-5jla1ha1huh7ljpuo68b6spl68ri3uh9.apps.googleusercontent.com";
  var btn = document.getElementById("btn");
  var btnLabel = document.getElementById("btnLabel");
  var errBox = document.getElementById("err");
  var okBox = document.getElementById("ok");

  function showErr(msg) {
    errBox.textContent = msg;
    errBox.style.display = "block";
    btn.disabled = false;
    btnLabel.textContent = "Coba lagi";
  }

  function waitGsi(cb, tries) {
    if (window.google && google.accounts && google.accounts.oauth2) return cb();
    if (tries > 60) return showErr("Google Sign-In tidak bisa dimuat. Cek koneksi lalu coba lagi.");
    setTimeout(function () { waitGsi(cb, tries + 1); }, 250);
  }

  btn.addEventListener("click", function () {
    btn.disabled = true;
    btnLabel.textContent = "Menghubungkan...";
    errBox.style.display = "none";
    waitGsi(function () {
      var client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "openid email profile",
        prompt: "select_account",
        callback: function (res) {
          if (res && res.access_token) {
            okBox.style.display = "block";
            btnLabel.textContent = "Berhasil";
            /* Kembali ke aplikasi lewat deep link. */
            window.location.href = "akuninstan://auth?token=" + encodeURIComponent(res.access_token);
            setTimeout(function () {
              showErr("Kalau aplikasi tidak terbuka otomatis, tutup halaman ini lalu buka aplikasi Akun Instan.");
            }, 4000);
          } else {
            showErr("Login Google dibatalkan.");
          }
        },
        error_callback: function (e) {
          var t = (e && e.type) || "";
          showErr(t === "popup_closed" || t === "popup_failed_to_open"
            ? "Login Google dibatalkan."
            : "Login Google gagal, coba lagi.");
        },
      });
      try { client.requestAccessToken(); }
      catch (e) { showErr("Login Google gagal, coba lagi."); }
    }, 0);
  });
})();
</script>
</body>
</html>
